<!DOCTYPE html>
<html lang="it">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="css/styles.css" />

<body>
  <!-- LIVELLO 0: pagina browser responsive, senza shell telefono -->
  <main class="home-page">

    <div class="home-page__background" aria-hidden="true"></div>
    <div class="home-page__overlay home-page__overlay--top" aria-hidden="true"></div>

    <div class="home-page__overlay home-page__overlay--vignette" aria-hidden="true"></div>

    <div class="home-layout">

      <!-- LIVELLO 3: header superiore -->
      <header class="home-topbar">

        <div class="location">

            <path d="M12 21s6-5.6 6-11a6 6 0 1 0-12 0c0 5.4 6 11 6 11Z" />
            <circle cx="12" cy="10" r="2.6" />

		  </a>

        <svg viewBox="0 0 24 24" aria-hidden="true">
